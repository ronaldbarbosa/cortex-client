<div class="flex flex-col min-h-screen bg-bg text-ink font-sans max-w-md mx-auto relative">
  <main class="flex-1 overflow-auto pb-16">
    <router-outlet />
  </main>

  <!-- Bottom tab bar -->
  <nav
    class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-16 bg-surface border-t border-border flex items-center z-50"
  >
    @for (tab of tabs; track tab.route) {
      <a
        [routerLink]="tab.route"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex-1 flex flex-col items-center justify-center gap-1 text-ink-3 transition-colors"
      >
        <app-icon [name]="tab.icon" [size]="20" [strokeWidth]="1.6" />
        <span class="font-mono text-[9px] uppercase tracking-[0.06em]">{{ tab.label }}</span>
      </a>
    }
  </nav>
</div>
