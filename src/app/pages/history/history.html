<!-- Hero -->
<div class="bg-hero px-5 pt-10 pb-6">
  <p class="font-mono text-[10px] text-hero-ink-2 uppercase tracking-[0.06em] mb-1">Seu</p>
  <h1 class="font-tight text-2xl font-semibold text-hero-ink tracking-tight mb-6">Histórico</h1>

  <!-- Stats -->
  <div class="grid grid-cols-3 gap-3">
    <div class="bg-hero-surface border border-hero-border rounded-xl p-3 text-center">
      <p class="font-tight text-xl font-bold text-hero-ink">{{ stats.totalVisits }}</p>
      <p class="font-mono text-[9px] text-hero-ink-2 uppercase tracking-[0.06em] mt-0.5">Visitas</p>
    </div>
    <div class="bg-hero-surface border border-hero-border rounded-xl p-3 text-center">
      <p class="font-tight text-xl font-bold text-accent">R${{ stats.totalSpent }}</p>
      <p class="font-mono text-[9px] text-hero-ink-2 uppercase tracking-[0.06em] mt-0.5">Total</p>
    </div>
    <div class="bg-hero-surface border border-hero-border rounded-xl p-3 text-center">
      <p class="font-tight text-[13px] font-bold text-hero-ink leading-tight">
        {{ stats.favoritePro }}
      </p>
      <p class="font-mono text-[9px] text-hero-ink-2 uppercase tracking-[0.06em] mt-0.5">
        Favorita
      </p>
    </div>
  </div>
</div>

<!-- Visit list -->
<div class="px-5 py-5 flex flex-col gap-3">
  <p class="font-mono text-[10px] text-ink-3 uppercase tracking-[0.06em]">Atendimentos</p>

  @for (visit of visits; track visit.id) {
    <div class="bg-surface border border-border rounded-2xl p-4">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div class="flex-1 min-w-0">
          <p class="font-tight text-[15px] font-semibold text-ink">{{ visit.service }}</p>
          <p class="font-mono text-[11px] text-ink-2 mt-0.5">com {{ visit.professional }}</p>
        </div>
        <div class="text-right shrink-0">
          <p class="font-tight text-[15px] font-semibold text-ink">R$ {{ visit.price }}</p>
          <p class="font-mono text-[10px] text-ink-3 mt-0.5">{{ visit.date }}</p>
        </div>
      </div>

      @if (visit.hasPhoto) {
        <div class="mb-3">
          <div class="h-28 bg-bg rounded-xl flex items-center justify-center border border-border">
            <app-icon name="image" [size]="24" color="var(--color-ink-3)" [strokeWidth]="1.4" />
          </div>
        </div>
      }

      <div class="flex gap-2">
        <button
          class="flex-1 flex items-center justify-center gap-1.5 border border-border rounded-xl py-2.5 font-mono text-[10px] text-ink-2 uppercase tracking-[0.06em] hover:border-accent/50 hover:text-accent transition-colors"
        >
          <app-icon name="star" [size]="12" [strokeWidth]="1.6" />
          Avaliar
        </button>
        <button
          class="flex-1 flex items-center justify-center gap-1.5 border border-border rounded-xl py-2.5 font-mono text-[10px] text-ink-2 uppercase tracking-[0.06em] hover:border-accent/50 hover:text-accent transition-colors"
        >
          <app-icon name="repeat" [size]="12" [strokeWidth]="1.6" />
          Repetir
        </button>
      </div>
    </div>
  }

  <div class="h-2"></div>
</div>
